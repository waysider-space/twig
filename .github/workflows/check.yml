name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Formatting
        shell: bash
        run: test -z "$(gofmt -l installer internal cmd examples)"

      - name: Vet
        run: go vet ./...

      - name: Test native installers and Go packages
        run: go test -count=1 ./...

      - name: Build
        run: go build ./cmd/twig
